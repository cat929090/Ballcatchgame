<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cursor Throw & Catch</title>
  <link rel="stylesheet" href="style.css" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
</head>
<body>
  <div id="hud">
    <div id="score">Score: 0</div>
    <div id="lives"></div>
    <div id="instr">Hold/click/touch to charge, release to throw. Catch by tapping/clicking.</div>
    <div id="version" style="font-weight:900;opacity:0.95;margin-left:8px;color:#9be">v8</div>
  </div>

  <canvas id="game" aria-label="game canvas"></canvas>

  <!-- Start menu overlay -->
  <div id="start-menu" role="dialog" aria-modal="true">
    <h1>Ball Catch</h1>
    <p class="muted">Choose a skin and press Play</p>
    <div id="skins" class="skins">
      <button class="skin-swatch" data-index="0" aria-label="Classic skin">
        <div class="swatch cursor" style="background:#ffffff"></div>
        <div class="swatch ball" style="background:#ff2b2b"></div>
        <div class="label">Classic</div>
      </button>
      <button class="skin-swatch" data-index="1" aria-label="Neon skin">
        <div class="swatch cursor" style="background:#8cf6ff"></div>
        <div class="swatch ball" style="background:#ff6ad5"></div>
        <div class="label">Neon</div>
      </button>
      <button class="skin-swatch" data-index="2" aria-label="Lime skin">
        <div class="swatch cursor" style="background:#b8ff6a"></div>
        <div class="swatch ball" style="background:#ffb86a"></div>
        <div class="label">Lime</div>
      </button>
      <button class="skin-swatch" data-index="3" aria-label="Gold skin">
        <div class="swatch cursor" style="background:#ffd36a"></div>
        <div class="swatch ball" style="background:#9b6aff"></div>
        <div class="label">Gold</div>
      </button>
    </div>
    <div style="margin-top:14px;display:flex;gap:10px;justify-content:center;">
      <button id="play-btn" class="primary">Play</button>
      <button id="cpu-btn" class="secondary">CPU Mode</button>
    </div>
  </div>

  <script src="script.js?v=8"></script>
</body>
</html>
