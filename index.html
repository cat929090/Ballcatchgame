<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cursor Throw & Catch</title>
  <link rel="stylesheet" href="style.css" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
</head>
<body>
  <div id="hud">
    <div id="score">Score: 0</div>
    <div id="lives"></div>
    <div id="instr">Hold/click/touch to charge, release to throw. Catch by tapping/clicking.</div>
    <div id="version" style="font-weight:900;opacity:0.95;margin-left:8px;color:#9be">v8</div>
  </div>

  <canvas id="game" aria-label="game canvas"></canvas>

  <!-- Start menu overlay (visible by default) -->
  <div id="start-menu" role="dialog" aria-modal="true">
    <h1>Ball Catch</h1>
    <p class="muted">Choose a skin and press Play</p>
    <div id="skins" class="skins">
      <button class="skin-swatch" data-index="0" aria-label="Classic skin">
        <div class="swatch cursor" style="background:#ffffff"></div>
        <div class="swatch ball" style="background:#ff2b2b"></div>
        <div class="label">Classic</div>
      </button>
      <button class="skin-swatch" data-index="1" aria-label="Neon skin">
        <div class="swatch cursor" style="background:#8cf6ff"></div>
        <div class="swatch ball" style="background:#ff6ad5"></div>
        <div class="label">Neon</div>
      </button>
      <button class="skin-swatch" data-index="2" aria-label="Lime skin">
        <div class="swatch cursor" style="background:#b8ff6a"></div>
        <div class="swatch ball" style="background:#ffb86a"></div>
        <div class="label">Lime</div>
      </button>
      <button class="skin-swatch" data-index="3" aria-label="Gold skin">
        <div class="swatch cursor" style="background:#ffd36a"></div>
        <div class="swatch ball" style="background:#9b6aff"></div>
        <div class="label">Gold</div>
      </button>
    </div>

    <div class="menu-controls" style="margin-top:12px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;">
      <button id="play-btn" class="primary">Play</button>
      <button id="hotseat-btn" class="secondary">Hotseat</button>
      <button id="cpu-btn" class="secondary selected" data-diff="Medium">CPU: Medium</button>
    </div>

    <div id="cpu-diffs" style="margin-top:12px;display:flex;gap:8px;justify-content:center;">
      <button class="diff-btn selected" data-diff="Easy">Easy</button>
      <button class="diff-btn" data-diff="Medium">Medium</button>
      <button class="diff-btn" data-diff="Hard">Hard</button>
      <button class="diff-btn" data-diff="Expert">Expert</button>
    </div>
  </div>

  <!-- Inline lightweight menu wiring so menu appears and works even if external script errors -->
  <script>
    (function(){
      const startMenu = document.getElementById('start-menu');
      const skinButtons = Array.from(document.querySelectorAll('.skin-swatch'));
      const playBtn = document.getElementById('play-btn');
      const cpuBtn = document.getElementById('cpu-btn');
      const hotseatBtn = document.getElementById('hotseat-btn');
      const diffBtns = Array.from(document.querySelectorAll('.diff-btn'));
      let selectedSkin = (typeof window.__selectedSkin === 'number') ? window.__selectedSkin : 0;
      let selectedDiff = (typeof window.__cpuDifficulty === 'string') ? window.__cpuDifficulty : 'Medium';
      let mode = (typeof window.__mode === 'string') ? window.__mode : 'CPU';

      function updateSkin(idx){ selectedSkin = idx; skinButtons.forEach(b=>b.classList.toggle('selected', Number(b.dataset.index)===idx)); window.__selectedSkin = idx; }
      function updateDiff(diff){ selectedDiff = diff; diffBtns.forEach(b=>b.classList.toggle('selected', b.dataset.diff===diff)); cpuBtn.dataset.diff = diff; cpuBtn.textContent = 'CPU: ' + diff; window.__cpuDifficulty = diff; }
      function setMode(m){ mode = m; window.__mode = m; hotseatBtn.classList.toggle('selected', m==='Hotseat'); cpuBtn.classList.toggle('selected', m==='CPU'); }

      skinButtons.forEach(b=>b.addEventListener('click', ()=> updateSkin(Number(b.dataset.index))));
      diffBtns.forEach(b=> b.addEventListener('click', ()=> updateDiff(b.dataset.diff)));
      cpuBtn.addEventListener('click', ()=> setMode('CPU'));
      hotseatBtn.addEventListener('click', ()=> setMode('Hotseat'));

      updateSkin(selectedSkin); updateDiff(selectedDiff); setMode(mode);

      playBtn.addEventListener('click', ()=>{
        window.__selectedSkin = selectedSkin;
        window.__cpuDifficulty = selectedDiff;
        window.__mode = mode;
        startMenu.style.display = 'none';
        if (typeof window.startGame === 'function') window.startGame(); else window.__startRequested = true;
      });

      // ensure menu stays visible over canvas
      startMenu.style.zIndex = 9999;
    })();
  </script>

  <script src="script.js?v=8"></script>
</body>
</html>
